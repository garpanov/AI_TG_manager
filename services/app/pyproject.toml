[project]
name = "ai-manager-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ai-manager-contracts",
    "aiogram>=3.22.0",
    "aio-pika>=9.5.7",
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.10.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "structlog>=25.4.0",
]

[project.scripts]
ai-manager-bot = "app.main:run"
ai-manager-scheduler = "app.scheduler:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.uv.sources]
ai-manager-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.4.1", "pytest-asyncio>=1.1.0", "ruff>=0.12.11"]
