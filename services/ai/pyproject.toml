[project]
name = "ai-manager-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ai-manager-contracts",
    "aio-pika>=9.5.7",
    "google-genai>=1.33.0",
    "pydantic-settings>=2.10.1",
    "structlog>=25.4.0",
]

[project.scripts]
ai-manager-ai = "ai_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]

[tool.uv.sources]
ai-manager-contracts = { workspace = true }
